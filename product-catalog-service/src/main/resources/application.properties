spring.application.name=order-service

# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Catalog Service
services.catalog.url=${CATALOG_SERVICE_URL:http://localhost:8081}
services.catalog.connect-timeout-ms=${CATALOG_CONNECT_TIMEOUT_MS:3000}
services.catalog.read-timeout-ms=${CATALOG_READ_TIMEOUT_MS:5000}

# Delivery Service
services.delivery.url=${DELIVERY_SERVICE_URL:http://localhost:8082}

# Order
app.order.delivery-fee=${APP_ORDER_DELIVERY_FEE:10.00}